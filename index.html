<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydney vs Derrick — Fantasy Golf League</title>
<style>

    --ink:#1e2530; --muted:#6b7280; --card:#ffffff; --bg:#f4f5f7; --line:#e6e8ec;
    --eagle:#7b3fe4; --birdie:#c0392b; --bogey:#2563eb; --dbl:#1e3a8a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;padding:24px 14px 60px}
  .wrap{max-width:980px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  header .eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted);font-weight:700}
  header h1{font-size:30px;margin:6px 0 4px}
  header .sub{color:var(--muted);font-size:14px}

  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 22px}
  nav.tabs button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:9px 15px;border-radius:999px;transition:.15s;white-space:nowrap}
  nav.tabs button:hover{border-color:var(--muted)}
  nav.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  nav.tabs button .w{font-size:11px;font-weight:700;margin-left:7px;padding:1px 7px;border-radius:999px}
  nav.tabs button .w.syd{background:var(--pink-soft);color:var(--pink-dark)}
  nav.tabs button .w.der{background:var(--green-soft);color:var(--green-dark)}
  nav.tabs button.active .w.syd,nav.tabs button.active .w.der{background:rgba(255,255,255,.2);color:#fff}

  .view{display:none} .view.active{display:block}

  .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin:6px 0 22px}
  .team{border-radius:18px;padding:20px;color:#fff;position:relative;overflow:hidden}
  .team.syd{background:linear-gradient(135deg,var(--pink),var(--pink-dark))}
  .team.der{background:linear-gradient(135deg,var(--green),var(--green-dark))}
  .team .name{font-size:15px;font-weight:700;letter-spacing:.03em;opacity:.95}
  .team .score{font-size:50px;font-weight:800;line-height:1;margin:8px 0 2px}
  .team .label{font-size:12px;opacity:.9}
  .team.lead::after{content:"▲ LEADING";position:absolute;top:14px;right:14px;font-size:11px;
    font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:999px}
  .team.win::after{content:"🏆 WON";position:absolute;top:14px;right:14px;font-size:11px;
    font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:999px}
  .vs{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:20px}

  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
  section h2{font-size:17px;margin-bottom:4px}
  .status{display:inline-block;margin-bottom:14px;background:#f7f8fa;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600}
  .status .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:middle}
  section .cap{font-size:13px;color:var(--muted);margin-bottom:14px}

  table.brk{width:100%;border-collapse:collapse;font-size:14px}
  .brk th,.brk td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
  .brk th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .brk td.num,.brk th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .pill.syd{background:var(--pink)} .pill.der{background:var(--green)}
  tr.total td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;background:#fafafa}
  .syd-row{background:linear-gradient(90deg,var(--pink-soft),transparent 60%)}
  .der-row{background:linear-gradient(90deg,var(--green-soft),transparent 60%)}
  .bon{font-size:11px;color:var(--muted)}
  .mc{color:var(--muted);font-style:italic}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .mini h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center}
  .season-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .season-row:last-child{border-bottom:none}
  .season-row b{font-variant-numeric:tabular-nums}

  .ebar{margin:14px 0}
  .ebar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px;flex-wrap:wrap}
  .ebar .top .ev{font-weight:700}
  .ebar .top .sc{color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eee;font-size:11px;font-weight:700;color:#fff}
  .bar .s{background:var(--pink);display:flex;align-items:center;padding:0 7px}
  .bar .d{background:var(--green);display:flex;align-items:center;justify-content:flex-end;padding:0 7px}
  .clink{cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .clink:hover{text-decoration-color:var(--muted)}

  .card-sc{border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px;margin-bottom:14px}
  .card-sc .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px}
  .card-sc .hd .nm{font-weight:700;font-size:15px;display:flex;align-items:center}
  .card-sc .hd .rt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card-sc .hd .rt b{color:var(--ink)}
  .sc{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  .sc td,.sc th{border:1px solid var(--line);text-align:center;padding:4px 0;width:5%}
  .sc th{background:#fafafa;color:var(--muted);font-weight:700;font-size:11px}
  .sc .lab{width:8%;text-align:left;padding-left:6px;color:var(--muted);font-weight:700;font-size:11px;background:#fafafa}
  .sc .sum{background:#f2f3f5;font-weight:700}
  .s-eagle{color:#fff;background:var(--eagle);border-radius:50%;font-weight:800}
  .s-birdie{color:#fff;background:var(--birdie);border-radius:50%;font-weight:800}
  .s-bogey{color:#fff;background:var(--bogey);font-weight:700}
  .s-dbl{color:#fff;background:var(--dbl);font-weight:700}
  .chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;background:#fff3cd;color:#8a6d00;border:1px solid #f0e2b8;margin-left:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}
  .legend span{display:flex;align-items:center;gap:5px}
  .dotk{width:12px;height:12px;border-radius:50%;display:inline-block}
  .note{font-size:12.5px;border-radius:10px;padding:10px 14px;margin-top:10px}
  .note.v{color:var(--green-dark);background:var(--green-soft);border:1px solid #bfe3bf}
  .note.champ{color:#8a6d00;background:#fff8e6;border:1px solid #f0e2b8}
  .note.info{color:var(--muted);background:#f7f8fa;border:1px solid var(--line)}
  details.rules summary{cursor:pointer;font-weight:700;font-size:14px}
  details.rules .cap{margin-top:10px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  @media(max-width:640px){
    .scoreboard{grid-template-columns:1fr}.vs{display:none}
    .two{grid-template-columns:1fr}.team .score{font-size:42px}
    .sc{font-size:11px}
  }
</style>
</head>

/* ============ HELPERS ============ */
function fmt(n){return Number.isInteger(n)?n+".0":String(n);}
function cls(s,p){const d=s-p;if(d<=-2)return"s-eagle";if(d===-1)return"s-birdie";if(d===1)return"s-bogey";if(d>=2)return"s-dbl";return"";}
function scoreboard(e){
  const sLead=e.syd>e.der, dLead=e.der>e.syd;
  const sCls=e.status==="final"?(e.winner==="syd"?"win":""):(sLead?"lead":"");
  const dCls=e.status==="final"?(e.winner==="der"?"win":""):(dLead?"lead":"");
  const lbl=e.status==="final"?"final points":"event points";
  return `<div class="scoreboard">
    <div class="team syd ${sCls}"><div class="name">SYDNEY</div><div class="score">${fmt(e.syd)}</div><div class="label">${lbl}</div></div>
    <div class="vs">vs</div>
    <div class="team der ${dCls}"><div class="name">DERRICK</div><div class="score">${fmt(e.der)}</div><div class="label">${lbl}</div></div>
  </div>`;
}
function grid(pl){
  const front=pl.s.slice(0,9),back=pl.s.slice(9);
  const outP=PAR.slice(0,9).reduce((a,b)=>a+b),inP=PAR.slice(9).reduce((a,b)=>a+b);
  const out=front.reduce((a,b)=>a+b),inn=back.reduce((a,b)=>a+b);
  const numsF=[1,2,3,4,5,6,7,8,9].map(x=>`<th>${x}</th>`).join('');
  const numsB=[10,11,12,13,14,15,16,17,18].map(x=>`<th>${x}</th>`).join('');
  const row=(arr,pars)=>arr.map((v,i)=>`<td class="${cls(v,pars[i])}">${v}</td>`).join('');
  return `<div class="card-sc">
    <div class="hd"><div class="nm"><span class="pill ${pl.t}"></span>${pl.n}${pl.bonus?`<span class="chip">${pl.bonus}</span>`:''}</div>
      <div class="rt"><b>${pl.tot}</b> (${pl.p})</div></div>
    <table class="sc">
      <tr><th class="lab">Hole</th>${numsF}<th class="sum">Out</th></tr>
      <tr><td class="lab">Par</td>${PAR.slice(0,9).map(v=>`<td>${v}</td>`).join('')}<td class="sum">${outP}</td></tr>
      <tr><td class="lab">Score</td>${row(front,PAR.slice(0,9))}<td class="sum">${out}</td></tr>
      <tr><th class="lab">Hole</th>${numsB}<th class="sum">In</th></tr>
      <tr><td class="lab">Par</td>${PAR.slice(9).map(v=>`<td>${v}</td>`).join('')}<td class="sum">${inP}</td></tr>
      <tr><td class="lab">Score</td>${row(back,PAR.slice(9))}<td class="sum">${inn}</td></tr>
    </table></div>`;
}
function posCell(p){return p==="MC"?`<span class="mc">MC</span>`:p;}
function holesBrk(e){
  const rows=t=>e.players.filter(p=>p.t===t).sort((a,b)=>b.pts-a.pts).map(p=>
    `<tr class="${t}-row"><td>${p.n}</td><td><span class="pill ${t}"></span>${t==="syd"?"Syd":"Der"}</td>
     <td class="num">${p.tot}</td><td class="num">${p.p}</td><td class="num">${p.eag}</td><td class="num">${p.bir}</td>
     <td class="num">${p.bog}</td><td class="num">${p.dbl}</td><td class="bon">${p.bonus||"—"}</td><td class="num">${fmt(p.pts)}</td></tr>`).join('');
  return `<table class="brk"><thead><tr><th>Player</th><th>Team</th><th class="num">R1</th><th class="num">Par</th>
    <th class="num">Eag</th><th class="num">Bir</th><th class="num">Bog</th><th class="num">Dbl</th><th>Bonus</th><th class="num">Points</th></tr></thead>
    <tbody>${rows("syd")}<tr class="total"><td colspan="9">SYDNEY — event total</td><td class="num">${fmt(e.syd)}</td></tr>
    ${rows("der")}<tr class="total"><td colspan="9">DERRICK — event total</td><td class="num">${fmt(e.der)}</td></tr></tbody></table>`;
}
function roundsBrk(e){
  const rows=t=>e.players.filter(p=>p.t===t).sort((a,b)=>b.pts-a.pts).map(p=>
    `<tr class="${t}-row"><td>${p.n}</td><td><span class="pill ${t}"></span>${t==="syd"?"Syd":"Der"}</td>
     <td class="num">${posCell(p.pos)}</td><td class="num">${p.eag}</td><td class="num">${p.bir}</td>
     <td class="num">${p.bog}</td><td class="num">${p.dbl}</td><td class="bon">${p.bonus||"—"}</td><td class="num">${fmt(p.pts)}</td></tr>`).join('');
  return `<table class="brk"><thead><tr><th>Player</th><th>Team</th><th class="num">Finish</th>
    <th class="num">Eag+</th><th class="num">Bir</th><th class="num">Bog</th><th class="num">Dbl+</th><th>Bonuses</th><th class="num">Points</th></tr></thead>
    <tbody>${rows("syd")}<tr class="total"><td colspan="8">SYDNEY — event total</td><td class="num">${fmt(e.syd)}</td></tr>
    ${rows("der")}<tr class="total"><td colspan="8">DERRICK — event total</td><td class="num">${fmt(e.der)}</td></tr></tbody></table>`;
}
const RULES=`<details class="rules"><summary>Scoring rules</summary>
  <div class="cap">Per hole: Double Eagle +20 · Eagle +8 · Birdie +3 · Par +0.5 · Bogey −0.5 · Double+ −1.
  Bonuses: 3-birdie streak +3 · bogey-free round +3 · all 4 rounds under 70 +5 · hole-in-one +10.
  Finish (final only): 1st 30 · 2nd 20 · 3rd 18 · 4th 16 · 5th 14 · 6th 12 · 7th 10 · 8th 9 · 9th 8 · 10th 7 · 11–15 = 6 · 16–20 = 5 · 21–25 = 4 · 26–30 = 3 · 31–40 = 2 · 41–50 = 1 · 51+ = 0.
  Missed cut: −5 for events with a cut (3M, Rocket, Wyndham). Playoff events (St. Jude on) are no-cut — no penalty.</div></details>`;

/* ============ VIEWS ============ */
function seasonView(){
  const stjude=EVENTS.find(x=>x.id==="stjude");
  const projSyd=SEASON.syd+stjude.syd, projDer=SEASON.der+stjude.der;
  const bars=EVENTS.map(e=>{
    const tot=e.syd+e.der, sp=Math.max(6,Math.round(e.syd/tot*100)), dp=100-sp;
    return `<div class="ebar"><div class="top"><span class="ev clink" data-go="${e.id}">${e.name}</span>
      <span class="sc">Syd ${fmt(e.syd)} · Der ${fmt(e.der)}${e.winner?` · ${e.winner==="syd"?"Sydney":"Derrick"} won 🏆`:" · in progress"}</span></div>
      <div class="bar"><div class="s" style="width:${sp}%">${fmt(e.syd)}</div><div class="d" style="width:${dp}%">${fmt(e.der)}</div></div></div>`;
  }).join('');
  return `
    <section>
      <h2>Season standings</h2>
      <span class="status"><span class="dot"></span>3 events complete · FedEx St. Jude in progress</span>
      <div class="two">
        <div class="mini">
          <h3>Points (completed events)</h3>
          <div class="season-row"><span>🥇 Sydney</span><b>${fmt(SEASON.syd)}</b></div>
          <div class="season-row"><span>🥈 Derrick</span><b>${fmt(SEASON.der)}</b></div>
          <div class="note champ" style="background:var(--pink-soft);border-color:#f0cdda;color:var(--pink-dark)">
            Live projection incl. St. Jude R1: <b>Sydney ${fmt(projSyd)} · Derrick ${fmt(projDer)}</b>.
            St. Jude points lock into the season total once Round 4 is final.</div>
        </div>
        <div class="mini">
          <h3>🏆 Events won</h3>
          <div class="season-row"><span><span class="pill syd"></span>Sydney</span><b>${SEASON.wonSyd}</b></div>
          <div class="season-row"><span><span class="pill der"></span>Derrick</span><b>${SEASON.wonDer}</b></div>
          <div class="note info">Fresh 5-player draft each event, so rosters change every week — tap a tournament to see who was on each squad.</div>
        </div>
      </div>
    </section>
    <section>
      <h2>Event-by-event</h2>
      <div class="cap">Click a tournament name to open its full details.</div>
      ${bars}
    </section>`;
}
function eventView(e){
  if(e.mode==="holes"){
    return `${scoreboard(e)}
      <section>
        <h2>${e.name}</h2><span class="status"><span class="dot"></span>${e.status}</span>
        <div class="cap">${e.meta}</div>
        ${holesBrk(e)}
        <div class="note v">✓ Verified from official Round 1 scorecards (PGA TOUR). Bonuses this round: 3-birdie streak (+3) for Matsuyama, Schauffele &amp; Hovland. No cut this event, so no missed-cut penalty. Finish-position points apply after Round 4.</div>
      </section>
      <section>
        <h2>Hole-by-hole scorecards</h2>
        <div class="legend">
          <span><i class="dotk" style="background:var(--eagle)"></i>Eagle</span>
          <span><i class="dotk" style="background:var(--birdie)"></i>Birdie</span>
          <span><i class="dotk" style="background:#fff;border:1px solid var(--line)"></i>Par</span>
          <span><i class="dotk" style="background:var(--bogey)"></i>Bogey</span>
          <span><i class="dotk" style="background:var(--dbl)"></i>Double+</span>
        </div>
        ${e.players.map(grid).join('')}
      </section>
      <section>${RULES}</section>`;
  }
  // rounds mode (completed prior events)
  let champNote;
  if(e.champ){
    champNote=`<div class="note champ">🏆 <b>Tournament winner:</b> ${e.champ.n} (${e.champ.t==="syd"?"Sydney's":"Derrick's"} pick) — took the event outright at 1st place.</div>`;
  } else {
    const top=e.players.slice().sort((a,b)=>b.pts-a.pts)[0];
    champNote=`<div class="note info">No drafted golfer won this event outright — the tournament champion wasn't on either roster. Top drafted finish: ${top.n} (${top.t==="syd"?"Sydney":"Derrick"}, ${top.pos==="MC"?"MC":"pos "+top.pos}).</div>`;
  }
  return `${scoreboard(e)}
    <section>
      <h2>${e.name}</h2>
      <span class="status"><span class="dot"></span>Final · ${e.winner==="syd"?"Sydney":"Derrick"} won 🏆</span>
      <div class="cap">${e.meta}</div>
      ${roundsBrk(e)}
      ${champNote}
      <div class="note info">Counts are totaled across all rounds played (Eag+ includes eagles &amp; better; Dbl+ includes double bogey or worse). Hole-by-hole wasn't captured for this event, so cards show round-level scoring from the league tracker. MC = missed cut (−5 penalty applied).</div>
    </section>
    <section>${RULES}</section>`;
}

/* ============ RENDER + ROUTING ============ */
const tabsEl=document.getElementById('tabs'), viewsEl=document.getElementById('views');
const TABS=[{id:"season",name:"Season"}].concat(EVENTS.map(e=>({id:e.id,name:e.name,e})));
tabsEl.innerHTML=TABS.map(t=>{
  let w="";
  if(t.e){ if(t.e.winner==="syd")w=`<span class="w syd">Syd 🏆</span>`;
    else if(t.e.winner==="der")w=`<span class="w der">Der 🏆</span>`;
    else w=`<span class="w ${t.e.syd>t.e.der?'syd':'der'}">${t.e.syd>t.e.der?'Syd':'Der'} ▲</span>`; }
  return `<button data-tab="${t.id}">${t.name}${w}</button>`;
}).join('');
viewsEl.innerHTML=TABS.map(t=>`<div class="view" id="v-${t.id}">${t.id==="season"?seasonView():eventView(t.e)}</div>`).join('');
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  const v=document.getElementById('v-'+id); if(!v)return;
  v.classList.add('active');
  document.querySelector(`#tabs button[data-tab="${id}"]`).classList.add('active');
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
  window.scrollTo({top:0,behavior:'smooth'});
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.tab);});
viewsEl.addEventListener('click',e=>{const c=e.target.closest('[data-go]');if(c)show(c.dataset.go);});
const start=(location.hash||'#season').slice(1);
show(TABS.some(t=>t.id===start)?start:'season');
</script>
</body>
</html>
